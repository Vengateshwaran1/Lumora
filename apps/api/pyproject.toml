[project]
name = "lumora-api"
version = "0.1.0"
description = "Lumora backend — FastAPI application, agent orchestration, RAG pipeline"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "tree-sitter>=0.26.0",
  "tree-sitter-language-pack>=1.14.3",
  "gitpython>=3.1.58",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=5.7.0",
  "httpx>=0.28.1",
  "pyyaml>=6.0.3",
  "qdrant-client>=1.19.0",
  "arq>=0.26",
  "redis>=5.0",
  "pyjwt>=2.10",
  "cryptography>=43.0",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
]

[dependency-groups]
dev = [
  "ruff>=0.7",
  "black>=24.10",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumora_api"]

# sentence-transformers pulls torch transitively (for the optional
# cross-encoder reranker — off by default, RERANKER_PROVIDER=none). The
# default PyPI torch wheel bundles the full CUDA stack (~2GB of
# nvidia-*/torch downloads) even though nothing here uses a GPU — pin to
# PyTorch's CPU-only wheel index instead, which is both smaller and
# actually correct for this deployment target.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# --- Ruff (linting only — Black owns formatting, see [tool.black]) ---
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "ASYNC", # flake8-async
  "SIM",  # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["lumora_api"]

# --- Black (formatting) ---
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "alembic/versions"

# --- mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "tests"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "tests.*.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

[[tool.mypy.overrides]]
# No published type stubs / py.typed marker for this package.
module = "rank_bm25.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# langgraph ships inline types but its strict-mode surface (generic
# StateGraph/CompiledGraph typing, Command/interrupt) is still rough at
# --strict — same treatment as rank_bm25 above rather than fighting
# upstream type-completeness in application code.
module = "langgraph.*"
ignore_missing_imports = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "langgraph_checkpoint_postgres.*"
ignore_missing_imports = true

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The DB engine (core/database.py) is a process-wide singleton, matching
# production — so tests must share one event loop too, or the second test
# to touch the DB gets a connection pool bound to an already-closed loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
