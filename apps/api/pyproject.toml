[project]
name = "lumora-api"
version = "0.1.0"
description = "Lumora backend — FastAPI application, agent orchestration, RAG pipeline"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "tree-sitter>=0.26.0",
  "tree-sitter-language-pack>=1.14.3",
  "gitpython>=3.1.58",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=5.7.0",
  "httpx>=0.28.1",
  "pyyaml>=6.0.3",
  "qdrant-client>=1.19.0",
]

[dependency-groups]
dev = [
  "ruff>=0.7",
  "black>=24.10",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumora_api"]

# --- Ruff (linting only — Black owns formatting, see [tool.black]) ---
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "ASYNC", # flake8-async
  "SIM",  # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["lumora_api"]

# --- Black (formatting) ---
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "alembic/versions"

# --- mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
